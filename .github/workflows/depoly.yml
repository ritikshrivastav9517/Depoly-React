name: React CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. GitHub repository ka code checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Docker Hub login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Docker image build + Docker Hub push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ritikshrivas822/my-app:latest

      # 4. AWS EC2 par deployment
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            sudo docker pull ritikshrivas822/my-app:latest

            sudo docker stop react-app || true
            sudo docker rm react-app || true

            sudo docker run -d \
              --name react-app \
              -p 3000:3000 \
              --restart unless-stopped \
              ritikshrivas822/my-app:latest